<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Rocket Autos</title>
    <style>
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { text-align: center; padding: 0; border: 0; margin: 0; background: #10151c; color: #f4f6f8; font-family: Arial, sans-serif; }
      #unity-canvas { display: none; position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; }
      #password-screen { box-sizing: border-box; min-height: 100%; display: grid; place-items: center; padding: 24px; }
      #password-card { width: min(360px, 100%); box-sizing: border-box; padding: 28px; border: 1px solid #34404d; border-radius: 12px; background: #1b232d; box-shadow: 0 16px 48px #0006; }
      #password-card h1 { margin: 0 0 8px; font-size: 24px; }
      #password-card p { margin: 0 0 20px; color: #b9c3ce; }
      #game-password { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #566474; border-radius: 6px; background: #111820; color: inherit; font-size: 16px; }
      #password-submit { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 6px; background: #1686f8; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
      #password-error { min-height: 1.2em; margin: 12px 0 0 !important; color: #ff9090 !important; }
    </style>
  </head>
  <body>
    <main id="password-screen">
      <form id="password-card">
        <h1>Rocket Autos</h1>
        <p>Enter the password to play.</p>
        <input id="game-password" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
        <button id="password-submit" type="submit">Continue</button>
        <p id="password-error" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #231F20"></canvas>
    <script src="Build/Build.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      }

      // Set to an empty string to skip the password screen.
      const GAME_PASSWORD = "";
      const passwordScreen = document.getElementById("password-screen");
      const gameCanvas = document.querySelector("#unity-canvas");

      function unlockAndStart() {
        passwordScreen.remove();
        gameCanvas.style.display = "block";
        startGame(gameCanvas);
      }

      if (typeof GAME_PASSWORD === "string" && GAME_PASSWORD.length > 0) {
        document.getElementById("password-card").addEventListener("submit", (event) => {
          event.preventDefault();
          const input = document.getElementById("game-password");
          if (input.value !== GAME_PASSWORD) {
            document.getElementById("password-error").textContent = "That password is incorrect.";
            input.select();
            return;
          }

          unlockAndStart();
        });
      } else {
        unlockAndStart();
      }

      function startGame(canvas) {
        createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/Build.data.unityweb",
        frameworkUrl: "Build/Build.framework.js.unityweb",
        codeUrl: "Build/Build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Rocket Autos",
        productVersion: "0.1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
        }).then((unityInstance) => {
        }).catch((message) => {
          alert(message);
        });
      }
    </script>
  </body>
</html>
